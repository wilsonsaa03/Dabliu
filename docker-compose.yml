# Entorno de DESARROLLO de DABLIU SaaS.
#   docker compose up -d        → PostgreSQL en localhost:5434 (datos persistentes en el volumen)
# El backend se ejecuta aparte con el perfil dev (ver backend/README.md).
# No usar estos valores en producción.
services:
  db:
    image: postgres:17-alpine
    container_name: dabliu-db
    environment:
      POSTGRES_DB: dabliu
      POSTGRES_USER: dabliu
      POSTGRES_PASSWORD: dabliu-dev
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - dabliu-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dabliu -d dabliu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dabliu-db-data:
