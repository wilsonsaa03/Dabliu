<header class="nav">
  <div class="wrap nav__in">
    <a class="brand" href="#inicio" aria-label="DABLIU Soluciones, inicio">
      <img src="logo-dabliu.png" alt="" width="40" height="40">
      <span><b>DABLIU</b><small>SOLUCIONES</small></span>
    </a>

    <nav aria-label="Principal">
      <ul class="menu" id="menu" [class.is-open]="menuOpen()">
        @for (link of links; track link.href) {
          <li><a [href]="link.href" (click)="closeMenu()">{{ link.label }}</a></li>
        }
        <li class="menu__cta"><a class="btn btn--primary" href="#contacto" (click)="closeMenu()">Solicitar diagnóstico gratuito</a></li>
      </ul>
    </nav>

    <a class="btn btn--primary nav__cta" href="#contacto">Diagnóstico gratuito</a>

    <button class="icon-btn theme-btn" type="button" (click)="themes.toggle()"
            [attr.aria-label]="themes.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
            [attr.title]="themes.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'">
      @if (themes.theme() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      }
    </button>

    <button class="icon-btn burger" type="button" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()" aria-controls="menu"
            [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
      @if (menuOpen()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      }
    </button>
  </div>
</header>
