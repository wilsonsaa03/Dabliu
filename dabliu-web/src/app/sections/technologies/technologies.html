<section class="band band--alt" id="tecnologias">
  <div class="wrap">
    <div class="head" appReveal>
      <span class="eyebrow">Capacidades</span>
      <h2 class="h2">Construimos con tecnología moderna.</h2>
      <p class="lead">Todo lo que tu solución necesita, conectado y pensado para crecer.</p>
    </div>

    <div class="eco" appReveal>
      <svg class="eco__lines" aria-hidden="true">
        @for (l of links; track $index) {
          <line [attr.x1]="nodes[l[0]].x + '%'" [attr.y1]="nodes[l[0]].y + '%'"
                [attr.x2]="nodes[l[1]].x + '%'" [attr.y2]="nodes[l[1]].y + '%'"
                [class.on]="isLinkOn(l)" />
        }
      </svg>

      @for (n of nodes; track n.name; let i = $index) {
        <button type="button" class="node" [class.node--hub]="n.hub" [class.is-on]="active() === i"
                [style.left.%]="n.x" [style.top.%]="n.y"
                (mouseenter)="select(i)" (focus)="select(i)" (click)="select(i)">
          <span class="node__orb">
            @if (n.hub) {
              <img src="logo-dabliu.png" alt="">
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="n.icon"/></svg>
            }
          </span>
          <span class="node__name">{{ n.name }}</span>
        </button>
      }

      <div class="eco__info" aria-live="polite">
        <b>{{ current().name }}</b>
        <span>{{ current().text }}</span>
      </div>
    </div>
  </div>
</section>
