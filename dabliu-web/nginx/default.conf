# Equivalente a vercel.json para el VPS (Dokploy + Traefik).

# www -> dominio principal
server {
    listen 80;
    server_name www.dabliusoluciones.tech;
    return 301 https://dabliusoluciones.tech$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik termina el TLS: las redirecciones deben ser relativas para no bajar a http.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # URL antigua de la política
    location = /politica-de-datos.html { return 301 /politica-de-datos; }

    # Sin barra final (excepto la raíz)
    location ~ ^(.+)/$ { return 301 $1; }

    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* ^/(logo-dabliu|favicon)\.png$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # Páginas prerenderizadas (/politica-de-datos -> politica-de-datos/index.html); lo demás, la app.
        try_files $uri $uri/index.html /index.csr.html;
    }
}
