spring:
  application:
    name: dabliu-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dabliu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    time-zone: UTC
  # Correo (SMTP) para avisos, invitaciones y recuperación de contraseña: se activa solo si defines
  # SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  # Detrás de un proxy (Render, Railway, Nginx...) toma la IP real del visitante desde
  # X-Forwarded-For, solo si el proxy está en una red interna. Sin esto, el límite por IP
  # contaría a todos los visitantes como uno solo.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

# Documentación OpenAPI/Swagger: apagada por defecto (actívala con API_DOCS_ENABLED=true).
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

dabliu:
  # Dirección de la aplicación privada (dabliu-app), para los enlaces de los correos.
  app-url: ${APP_URL:http://localhost:4301}
  # Dominios de la landing autorizados a enviar el formulario público (separados por coma).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  auth:
    # Clave HMAC en Base64 (mínimo 32 bytes). Generar con: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:14d}
    secure-cookies: ${AUTH_SECURE_COOKIES:true}
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${AUTH_LOCK_DURATION:15m}
    invitation-ttl: ${INVITATION_TTL:72h}
    password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
    log-links: false
  # Primer superadministrador (solo se usa si no existe ningún usuario).
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:}
  # Límite de envíos del formulario público por IP (frena spam).
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX:5}
    window: ${RATE_LIMIT_WINDOW:10m}
  # Límite de intentos en login, recuperación e invitaciones por IP (frena fuerza bruta).
  auth-rate-limit:
    max-requests: ${AUTH_RATE_LIMIT_MAX:20}
    window: ${AUTH_RATE_LIMIT_WINDOW:10m}
  # Aviso por correo de cada solicitud nueva (requiere también el SMTP de spring.mail).
  notifications:
    email-to: ${NOTIFY_EMAIL_TO:}
    email-from: ${NOTIFY_EMAIL_FROM:}
