spring:
  application:
    name: dabliu-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dabliu}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  # Correo (SMTP) para avisos: se activa solo si defines SPRING_MAIL_HOST, SPRING_MAIL_PORT,
  # SPRING_MAIL_USERNAME y SPRING_MAIL_PASSWORD como variables de entorno.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}
  # Detrás de un proxy (Render, Railway, Nginx...) toma la IP real del visitante desde
  # X-Forwarded-For, solo si el proxy está en una red interna. Sin esto, el límite por IP
  # contaría a todos los visitantes como uno solo.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

dabliu:
  # Dominios de la landing autorizados a llamar la API (separados por coma).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Usuario interno para consultar y gestionar las solicitudes.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  # Límite de solicitudes públicas por IP para frenar spam.
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX:5}
    window: ${RATE_LIMIT_WINDOW:10m}
  # Aviso por correo de cada solicitud nueva (requiere también el SMTP de spring.mail).
  notifications:
    email-to: ${NOTIFY_EMAIL_TO:}
    email-from: ${NOTIFY_EMAIL_FROM:}
