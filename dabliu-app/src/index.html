<!doctype html>
<html lang="es-CO" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>DABLIU SaaS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Aplicación privada: no debe aparecer en buscadores. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#05070f">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <script>
    // Tema guardado (preferencia local del usuario) antes de pintar, para evitar un destello.
    try { var t = localStorage.getItem('dabliu-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <app-root>
    <div style="min-height:100vh;display:grid;place-items:center;background:#05070f;color:#7c89a8;font:14px system-ui">Cargando DABLIU SaaS…</div>
  </app-root>
</body>
</html>
