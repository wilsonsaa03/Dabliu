<a href="#contenido" class="skip">Saltar al contenido</a>

<!-- Barra superior: solo celular y tablet -->
<header class="sticky top-0 z-30 flex h-14 items-center gap-3 border-b border-line bg-[var(--bg-elev)]/90 px-3 backdrop-blur lg:hidden">
  <button type="button" class="btn btn-ghost btn-icon" (click)="drawerOpen.set(true)" aria-label="Abrir menú" [attr.aria-expanded]="drawerOpen()">
    <lucide-icon [img]="icons.Menu" [size]="20" />
  </button>
  <a routerLink="/" class="flex items-center gap-2 no-underline">
    <img src="logo-dabliu.png" alt="" width="34" height="26" class="h-[26px] w-[34px] rounded-md bg-black object-contain">
    <span class="font-display text-[15px] font-extrabold tracking-[0.04em] text-fg">DABLIU</span>
  </a>
  <span class="flex-1"></span>
  <a routerLink="/perfil" aria-label="Mi perfil">
    @if (auth.user(); as u) { <app-avatar [name]="u.fullName" [size]="30" /> }
  </a>
</header>

<!-- Fondo del cajón en celular -->
@if (drawerOpen()) {
  <div class="fixed inset-0 z-40 bg-[var(--overlay)] lg:hidden" (click)="drawerOpen.set(false)" aria-hidden="true"></div>
}

<div class="lg:flex">
  <!-- Barra lateral -->
  <aside class="sidebar fixed inset-y-0 left-0 z-50 flex w-[264px] flex-col border-r border-line bg-[var(--bg-elev)] lg:sticky lg:top-0 lg:z-0 lg:h-screen lg:translate-x-0"
         [class.is-open]="drawerOpen()" aria-label="Navegación principal">
    <div class="flex h-16 items-center gap-3 px-5">
      <img src="logo-dabliu.png" alt="" width="40" height="30" class="h-[30px] w-10 rounded-lg bg-black object-contain">
      <div class="leading-none">
        <span class="block font-display text-[16px] font-extrabold tracking-[0.05em]">DABLIU</span>
        <span class="mt-1 block text-[10px] font-semibold uppercase tracking-[0.3em] text-accent">SaaS</span>
      </div>
      <button type="button" class="btn btn-ghost btn-icon ml-auto lg:hidden" (click)="drawerOpen.set(false)" aria-label="Cerrar menú">
        <lucide-icon [img]="icons.X" [size]="18" />
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 pb-4">
      @for (group of nav(); track group.label) {
        <p class="mb-1 mt-5 px-3 text-[11px] font-semibold uppercase tracking-[0.12em] text-fg-3">{{ group.label }}</p>
        <ul class="space-y-0.5">
          @for (item of group.items; track item.path) {
            <li>
              <a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: !!item.exact }" class="nav-link">
                <lucide-icon [img]="item.icon" [size]="17" />
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      }
    </nav>

    <!-- Usuario -->
    @if (auth.user(); as u) {
      <div class="relative border-t border-line p-3">
        @if (menuOpen()) {
          <div class="card absolute bottom-[calc(100%+6px)] left-3 right-3 z-10 p-1.5 shadow-[var(--shadow-2)]" role="menu" style="animation: pop-in .18s var(--ease-snappy) both">
            <a routerLink="/perfil" class="menu-item" role="menuitem"><lucide-icon [img]="icons.UserRound" [size]="16" />Mi perfil</a>
            <button type="button" class="menu-item" role="menuitem" (click)="theme.toggle()">
              <lucide-icon [img]="theme.theme() === 'dark' ? icons.Sun : icons.Moon" [size]="16" />
              {{ theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro' }}
            </button>
            <div class="my-1 h-px bg-[var(--line)]"></div>
            <button type="button" class="menu-item text-danger" role="menuitem" (click)="auth.logout()">
              <lucide-icon [img]="icons.LogOut" [size]="16" />Cerrar sesión
            </button>
          </div>
        }
        <button type="button" class="flex w-full items-center gap-3 rounded-xl p-2 text-left transition-colors hover:bg-[var(--surface-hover)]"
                (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()" aria-haspopup="menu">
          <app-avatar [name]="u.fullName" [size]="34" />
          <span class="min-w-0 flex-1">
            <span class="block truncate text-[13.5px] font-semibold text-fg">{{ u.fullName }}</span>
            <span class="block truncate text-[12px] text-fg-3">{{ roleLabel() }}</span>
          </span>
          <lucide-icon [img]="icons.ChevronsUpDown" [size]="15" class="text-fg-3" />
        </button>
      </div>
    }
  </aside>

  <!-- Contenido -->
  <main id="contenido" tabindex="-1" class="min-w-0 flex-1 outline-none">
    <div class="mx-auto w-full max-w-[1280px] px-4 py-6 sm:px-6 lg:px-10 lg:py-8">
      <router-outlet />
    </div>
  </main>
</div>
